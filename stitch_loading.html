<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased text-on-surface">
<main class="w-full max-w-sm mx-auto flex flex-col items-center justify-center">

<div id="lottie-container" class="relative w-48 h-48 mb-8"></div>

<div class="h-8 flex items-center justify-center overflow-hidden w-full">
<p class="font-body-md text-body-md text-on-surface-variant fade-transition opacity-100 m-0" id="loading-text" style="opacity: 1;">Parsing resume...</p>
</div>
<div class="mt-lg w-full bg-surface-variant h-1 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-1/3 animate-[pulse_2s_ease-in-out_infinite]" style="animation: indeterminateProgressBar 2s infinite linear; transform-origin: 0% 50%;"></div>
</div>
<style>
                @keyframes indeterminateProgressBar {
                    0% { transform: translateX(0) scaleX(0); }
                    40% { transform: translateX(0) scaleX(0.4); }
                    100% { transform: translateX(100%) scaleX(0.5); }
                }
            </style>
</main>
<script src="brainData.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load Lottie using the injected brainData variable
            lottie.loadAnimation({
                container: document.getElementById('lottie-container'),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                animationData: brainData
            });

            const texts = [
                'Parsing resume...',
                'Comparing with job description...',
                'Generating insights...'
            ];
            let currentIndex = 0;
            const textElement = document.getElementById('loading-text');

            setInterval(() => {
                textElement.style.opacity = '0';
                
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % texts.length;
                    textElement.textContent = texts[currentIndex];
                    textElement.style.opacity = '1';
                }, 500); 
            }, 3000); 

            // Redirect to code.html after 8 seconds
            setTimeout(() => {
                window.location.href = 'code.html';
            }, 8000);
        });
    </script>
